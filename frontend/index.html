<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Rutinas</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icono.svg">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">
  <header id="header">
    <h1 id="marca" onclick="location.hash=''"><span class="logo"></span>Rutinas</h1>
    <div class="spacer"></div>
    <button class="btn-ghost btn-ayuda" id="btn-ayuda" hidden title="Ver cómo se usa esta pantalla"><span class="signo">?</span>Ayuda</button>
    <div id="usuario-menu" hidden>
      <button class="btn-ghost" id="btn-usuario"></button>
      <div id="usuario-dropdown" class="dropdown" hidden>
        <button data-accion="cambiar-clave">Cambiar contraseña</button>
        <button data-accion="salir">Salir</button>
      </div>
    </div>
  </header>
  <div id="layout">
    <nav id="nav" hidden></nav>
    <main id="main"><div class="cargando">Cargando…</div></main>
  </div>
</div>
<div id="modal-fondo" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toasts"></div>
<div id="tour-overlay"><div id="tour-spot"></div><div id="tour-tip" role="dialog" aria-live="polite"></div></div>
<script src="/js/app.js"></script>
</body>
</html>
